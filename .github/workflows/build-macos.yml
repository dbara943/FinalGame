name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "IslandDefenders" \
            --add-data "images:images" \
            --add-data "sounds:sounds" \
            --add-data "lang:lang" \
            --add-data "towers:towers" \
            --add-data "enemies:enemies" \
            --add-data "ships:ships" \
            --add-data "menu:menu" \
            --add-data "effects:effects" \
            game.py

      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent IslandDefenders.app IslandDefenders-macos.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandDefenders-macos
          path: dist/IslandDefenders-macos.zip
