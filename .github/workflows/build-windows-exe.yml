name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build PyInstaller bootloader from source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git pyinstaller-src
          cd pyinstaller-src/bootloader
          python ./waf configure all
          cd ..
          pip install .

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name "IslandDefenders" `
            --add-data "images;images" `
            --add-data "sounds;sounds" `
            --add-data "lang;lang" `
            --add-data "towers;towers" `
            --add-data "enemies;enemies" `
            --add-data "ships;ships" `
            --add-data "menu;menu" `
            --add-data "effects;effects" `
            game.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: IslandDefenders-windows
          path: dist/IslandDefenders
